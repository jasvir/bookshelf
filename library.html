.skip-link:focus { top: 12px; }

.masthead {

.navigation-dock { bottom: 26px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; height: 51px; padding: 5px 9px; background: #faf7edee; border: 1px solid #c6b693; border-radius: 7px; box-shadow: 0 4px 22px #3c291825, 0 1px 2px #3c291813; }

.play-icon { display: none; }

.scene-caption { bottom: 32px; left: 26px; display: flex; align-items: center; gap: 9px; max-width: 180px; padding: 8px 9px; background: #fbf5e7e6; color: #76664c; border-radius: 2px; font-size: 7px; line-height: 1.5; font-weight: 600; text-transform: uppercase; letter-spacing: 1.4px; pointer-events: none; }
.caption-rule { width: 18px; height: 1px; background: #ac8b59; flex: 0 0 auto; }

.inspiration-credit:hover { color: #12674f; }
#location-label { font-family: Georgia, "Times New Roman", serif; font-size: 10px; color: #67543d; font-style: italic; }
#hint { font-size: 8px; letter-spacing: .3px; color: #8b7758; }

.book-toast small { display: block; margin-top: 3px; font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; font-size: 10px; color: #8b7758; }
[hidden] { display: none !important; }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

.running-mouse { animation: mouse-scamper 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.shelf-tile:nth-child(2n) .running-mouse { animation-delay: -3s; }
.floating-book { pointer-events: none; }
.flying-book-motion {
  translate: 0px 0px;
  rotate: 0deg;
  transform-box: view-box;
  transform-origin: 0px 0px;
  animation: book-flight-fallback var(--flight-duration, 48s) ease-in-out var(--flight-delay, 0s) infinite;
}
@supports (offset-path: path('M0 0 L1 1')) and (offset-anchor: 0px 0px) {
  .flying-book-motion {
    offset-path: var(--flight-path);
    offset-anchor: 0px 0px;
    offset-position: 0px 0px;
    offset-rotate: 0deg;
    animation-name: book-flight;
    animation-timing-function: linear;
  }
}
.twinkle { animation: star-twinkle 3.4s ease-in-out infinite; }
.swimming-fish {
  translate: 0px 0px;
  rotate: 0deg;
  transform-box: view-box;
  transform-origin: 0px 0px;
  animation: fish-swim var(--swim-duration, 12s) ease-in-out var(--swim-delay, 0s) infinite var(--swim-direction, normal);

.fish-tail {
  rotate: 0deg;
  animation: fish-tail-flick var(--tail-duration, .9s) ease-in-out var(--tail-delay, 0s) infinite;
}
.clock-pendulum {
  rotate: 0deg;
  transform-box: view-box;
  transform-origin: var(--pendulum-origin, 0px 0px);
  animation: pendulum-swing var(--pendulum-duration, 2.8s) ease-in-out var(--pendulum-delay, 0s) infinite;

.rocking-horse {

:is(body.paused, body.is-background) :is(.running-mouse, .flying-book-motion, .twinkle,
.swimming-fish, .fish-tail, .clock-pendulum, .falling-leaf, .rocking-horse) { animation-play-state: paused; }
.motion-still, .motion-still :is(.running-mouse,.flying-book-motion,.twinkle,.swimming-fish,.fish-tail,.clock-pendulum,.falling-leaf,.rocking-horse) { animation: none !important; }
@keyframes mouse-scamper { 0%, 15%, 85%, 100% { translate: 0 0; } 35%, 65% { translate: 64px -1px; } 45%, 55% { translate: 62px 0; } }
@keyframes book-flight { 0% { offset-distance: 0%; rotate: -4deg; } 50% { rotate: 4deg; } 100% { offset-distance: 100%; rotate: -4deg; } }
@keyframes book-flight-fallback {

  25% { translate: var(--flight-x1, 400px) var(--flight-y1, -300px); rotate: 4deg; }
  50% { translate: var(--flight-x2, 700px) var(--flight-y2, 200px); rotate: -3deg; }

}
@keyframes star-twinkle { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes fish-swim {

  50% { translate: 9px 0px; rotate: 1deg; }

}
@keyframes fish-tail-flick { 0%, 100% { rotate: -7deg; } 50% { rotate: 7deg; } }
@keyframes pendulum-swing { 0%, 100% { rotate: -10deg; } 50% { rotate: 10deg; } }
@keyframes horse-rock { 0%, 100% { rotate: -4deg; translate: 0px 1px; } 25%, 75% { translate: 0px 0px; } 50% { rotate: 4deg; translate: 0px 1px; } }
@keyframes leaf-fall {

  100% { opacity: 0; translate: var(--leaf-drift, 7px) var(--leaf-drop, 64px); rotate: calc(var(--leaf-turn, 38deg) * 1.2); }
}

// A flight of stairs drawn in its own little perspective. The three flights
// intentionally disagree about which direction is up at their shared landings.
function stairFlight(a, b, width, count, colors, rise = 0) {
  const pt = (p) => `${p[0].toFixed(2)},${p[1].toFixed(2)}`;
  const at = (t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t - rise * t];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const down = [0, 6];
  let svg = '';
  for (let i = 0; i < count; i++) {
    const p = at(i / count), q = at((i + 1) / count);
    const r = add(q, width), s = add(p, width);
    svg += `<path d="M${pt(p)}L${pt(q)}L${pt(add(q, down))}L${pt(add(p, down))}Z" fill="${colors[2]}" stroke-width=".8"/>`;
    svg += `<path d="M${pt(q)}L${pt(r)}L${pt(add(r, down))}L${pt(add(q, down))}Z" fill="${colors[1]}" stroke-width=".8"/>`;
    svg += `<path d="M${pt(p)}L${pt(q)}L${pt(r)}L${pt(s)}Z" fill="${i % 3 === 0 ? colors[3] : colors[0]}" stroke-width=".8"/>`;
    const h1 = add(p, [width[0] * .12, width[1] * .12]);
    const h2 = add(q, [width[0] * .83, width[1] * .83]);
    svg += line(`M${pt(h1)}L${pt(h2)}`, '#fff0c4', .35, .65);
    if (i % 2 === 0) {
      const h3 = add(q, [width[0] * .35, width[1] * .35 + 1]);
      svg += line(`M${pt(h3)}l-1 3m3 -2l-1 2`, '#6d4d3f', .42, .65);
    }
  }
  const railStart = add(at(0), [width[0] * .95, width[1] * .95 - 18]);
  const railEnd = add(at(1), [width[0] * .95, width[1] * .95 - 18]);
  let posts = '', highlights = '', nails = '';
  for (let i = 0; i <= count; i += 2) {
    const base = add(at(i / count), [width[0] * .95, width[1] * .95]);
    posts += `M${pt(base)}v-18`;
    highlights += `M${base[0] + .6} ${base[1] - 2}v-15`;
    nails += ellipsePath(base[0], base[1] - 18, 1.2);
  }
  svg += line(posts, '#584833', 1, 1.8) + line(highlights, '#d8b85e', .9, .8) + `<path d="${nails}" fill="#e0bd61" stroke="none"/>`;
  svg += line(`M${pt(railStart)}L${pt(railEnd)}`, '#443a2a', 1, 2.9);
  svg += line(`M${railStart[0]} ${railStart[1] - .5}L${railEnd[0]} ${railEnd[1] - .5}`, '#d7b45b', 1, 1.35);
  return svg;
}

// Roman clock numerals are little pen strokes, so SVG exports are font independent.
function romanDial(cx, cy, radius) {
  const numerals = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
  const number = value => Number(value.toFixed(3));
  const strokes = numerals.map((n, i) => {
    const a = i * Math.PI / 6;
    // Keep the original dial's two-decimal placements and glyph spacing.
    const x = Number((cx + Math.sin(a) * radius).toFixed(2));
    const y = Number((cy - Math.cos(a) * radius).toFixed(2));
    return [...n].map((c, j) => {
      const gx = number(x + (j - (n.length - 1) / 2) * 3.2);
      if (c === 'I') return `M${gx} ${number(y - 2)}v4m-1 -4h2m-2 4h2`;
      if (c === 'V') return `M${number(gx - 1.3)} ${number(y - 2)}L${gx} ${number(y + 2)}l1.3 -4`;
      return `M${number(gx - 1.3)} ${number(y - 2)}l2.6 4m0 -4l-2.6 4`;
    }).join('');
  }).join('');
  return `<path d="${strokes}" fill="none" stroke-width=".65"/>`;
}

function penrosetriangle(seed, token, quality = 'full') {
  // Canonical three-face topology adapted from Bromskloss's public-domain
  // Penrose triangle.svg (Wikimedia Commons), with our own material and base.
  // Each face continues through a corner into the next apparent depth plane.
  const faces=[
    'M-32.351 -26.480L-22.613 -26.433L4.189 -73.066L42.568 -9.109L47.337 -17.808L4.319 -90.771Z',
    'M-47.337 -17.502L-42.825 -9.000L42.601 -9.059L4.194 -73.060L-0.626 -64.671L27.184 -17.554Z',
    'M-6.133 -90.870L-47.332 -17.517L27.196 -17.538L21.920 -26.452L-32.394 -26.444L4.361 -90.770Z'
  ];
  let out=ornamentBase(seed,38)+'<path d="M-28 -9v2h7v-2ZM21 -9v2h7v-2Z" fill="#79573e" stroke-width=".65"/>';
  out+='<g class="impossible-ornament penrose-tribar" data-depth-cycle="ab-over-bc,bc-over-ca,ca-over-ab" stroke-width="1.05">';
  faces.forEach((d,i)=>{out+=`<path d="${d}" fill="${['#eed49a','#aa7c4e','#d3ac6d'][i]}"/>`;});
  if(quality!=='compact')out+=`<path d="${faces.join('')}" fill="url(#grain)" stroke="none" opacity=".22"/>`;
  return out+'</g>';
}

const motifPaint = (d, fill, extra = '') => `<path d="${d}" fill="${fill}"${extra}/>`;
const motifMotion = (name, body, animate, extra = '') =>
  animate ? `<g class="${name}"${extra}>${body}</g>` : body;

function distantStairFlight(a, b, width, count, colors, rise = 0) {
  const number = value => Number(value.toFixed(2));
  const point = p => `${number(p[0])} ${number(p[1])}`;
  const at = t => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t - rise * t];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const start = at(0), end = at(1), down = [0, 6];
  const railOffset = [width[0] * .95, width[1] * .95];
  const rail = t => add(at(t), railOffset);
  let sides = '', treads = '', posts = '';
  for (let i = 0; i <= count; i++) {
    const base = at(i / count), far = add(base, width);
    treads += `M${point(base)}L${point(far)}`;
    if (i) sides += `M${point(base)}L${point(far)}L${point(add(far, down))}L${point(add(base, down))}Z`;
    if (i % 2 === 0) posts += `M${point(rail(i / count))}v-18`;
  }
  const railStart = add(rail(0), [0, -18]), railEnd = add(rail(1), [0, -18]);
  return motifPaint(`M${point(start)}L${point(end)}L${point(add(end, down))}L${point(add(start, down))}Z`, colors[2]) +
    motifPaint(sides, colors[1]) +
    motifPaint(`M${point(start)}L${point(end)}L${point(add(end, width))}L${point(add(start, width))}Z`, colors[0]) +
    line(treads, ink, .8, .8) + line(posts, '#584833', 1, 1.8) +
    line(`M${point(railStart)}L${point(railEnd)}`, '#443a2a', 1, 2.9) +
    line(`M${point(add(railStart, [0, -.5]))}L${point(add(railEnd, [0, -.5]))}`, '#d7b45b', 1, 1.35);
}

function distantFish(x, y, scale, reverse, seed, phase, animate) {
  const delay = (-2.4 - Math.abs(seed % 9) * .63 - phase * 5.2).toFixed(2);
  const body = `<path${animate ? ` class="fish-tail" style="transform-origin:-10px 0px;transform-box:view-box;--tail-duration:${(.85 + phase * .23).toFixed(2)}s;--tail-delay:${delay}s"` : ''} d="M-9 -1l-11 -7l2 9l-3 7l12 -6Z" fill="#de8a4c"/>` +
    motifPaint('M-12 0Q-9 -9 3 -7Q14 -6 15 0Q12 8 1 7Q-9 7 -12 0Z', '#e99d44') + dot(10, -1, 1.5);
  const motion = motifMotion('swimming-fish', body, animate, ` style="--swim-duration:${(10.8 + Math.abs(seed % 6) * .6 + phase * 3.3).toFixed(1)}s;--swim-delay:${delay}s;--swim-direction:${phase ? 'reverse' : 'normal'}"`);
  return `<g transform="translate(${x} ${y}) scale(${reverse ? -scale : scale} ${scale})" stroke-width=".8">${motion}</g>`;
}

function rotatedBounds(w,h,a){const t=a*Math.PI/180,c=Math.cos(t),s=Math.sin(t),xs=[0,w*c,h*s,w*c+h*s],ys=[0,w*s,-h*c,w*s-h*c];return{minX:Math.min(...xs),maxX:Math.max(...xs),minY:Math.min(...ys),maxY:Math.max(...ys)};}

function leaningCluster(x,base,available,maxH,seed,r,quality='full'){
 const requested=2+Math.floor(r()*3),widths=Array.from({length:requested},()=>17+r()*15),firstHeight=maxH*(.70+r()*.13);
 const leading=Math.max(6,Math.min(12,Math.atan2(26,firstHeight)*180/Math.PI));
 for(let count=requested;count>=2;count--){
  const volumes=[],contacts=[];let localX=0,height=firstHeight;
  for(let i=0;i<count;i++){
   const angle=leading*(1-i/(count-1)),a=angle*Math.PI/180,c=Math.cos(a),s=Math.sin(a),width=widths[i],anchorY=base-width*s;
   volumes.push({x:localX,y:anchorY,width,height,angle});
   if(i<count-1){
    // This is the actual upper right cover corner used by renderBook, rather
    // than an empty corner of its rectangular bounding box.
    const contact={x:localX+(width-1)*c+(height-1.9)*s,y:anchorY+(width-1)*s-(height-1.9)*c};
    const nextAngle=leading*(1-(i+1)/(count-1))*Math.PI/180,nc=Math.cos(nextAngle),ns=Math.sin(nextAngle),leftEdge=1.595;
    const distance=(base-contact.y-(widths[i+1]-leftEdge)*ns)/nc;
    localX=contact.x-leftEdge*nc-distance*ns;height=distance+4.2;
    contacts.push({x:contact.x,y:contact.y,nextDistance:distance});
   }
  }
  const span=volumes.at(-1).x+volumes.at(-1).width;
  if(span>available||volumes.some(v=>{const b=rotatedBounds(v.width,v.height,v.angle);return v.y+b.minY<base-maxH+.5;}))continue;
  let out=`<g class="leaning-cluster leaning-book-group" data-contact-count="${contacts.length}" data-contact-points="${contacts.map(p=>`${(x+p.x).toFixed(4)},${p.y.toFixed(4)}`).join(';')}" data-cluster-bounds="${x},${base-maxH},${span},${maxH}">`;
  volumes.forEach((v,i)=>{out+=`<g class="leaning-volume" data-neighbor="${i}"${contacts[i]?` data-contact="${(x+contacts[i].x).toFixed(4)},${contacts[i].y.toFixed(4)}" data-contact-local="${v.width-1},${-v.height+1.9},1.595,${-contacts[i].nextDistance}"`:''}>${renderBook({x:x+v.x,y:v.y,width:v.width,height:v.height,angle:v.angle,id:Math.floor(r()*BOOKS.length),seed:hash(seed,i,'leaning'),detail:quality})}</g>`;});
  return{markup:out+'</g>',span,count};

}

function uprightRun(x,base,width,maxH,seed,untidy=true,quality='full'){
 if(maxH<55)return'';
 const r=random(seed);let s=`<g class="book-run upright-book-run" data-run-bounds="${x},${base-maxH},${width},${maxH}">`,cursor=x+2,i=0,clustered=false;
 while(cursor<x+width-13&&i<60){
  if(untidy&&!clustered&&i===1&&width>112&&maxH>95){
   const cluster=leaningCluster(cursor,base,x+width-cursor-2,maxH,hash(seed,i,'cluster'),r,quality);clustered=true;
   if(cluster){s+=cluster.markup;cursor+=cluster.span+.8;i+=cluster.count;continue;}
  }
  let w=17+r()*18,h=Math.max(48,maxH*(.66+r()*.31)),a=0;
  if(untidy){const lean=r();if(lean>.84)a=(r()-.5)*8;else if(lean>.62)a=(r()-.5)*2.6;}
  const remaining=x+width-cursor-2;
  if(remaining<w+13){w=remaining;a=0;}
  let box=rotatedBounds(w,h,a),span=box.maxX-box.minX;
  if(span>remaining){a=0;w=Math.min(w,remaining);box=rotatedBounds(w,h,a);span=w;}
  if(box.maxY-box.minY>maxH){h-=box.maxY-box.minY-maxH+.3;box=rotatedBounds(w,h,a);span=box.maxX-box.minX;}
  if(w<12)break;
  s+=renderBook({x:cursor-box.minX,y:base-box.maxY,width:w,height:h,angle:a,id:Math.floor(r()*BOOKS.length),seed:hash(seed,i),detail:quality});
  cursor+=span+.5+r()*.7;i++;
 }return s+'</g>';
}
function flatStack(x,base,width,maxH,seed,quality='full'){
 if(width<68||maxH<12)return'';
 const r=random(seed);let s=`<g class="book-run stacked-book-run" data-run-bounds="${x},${base-maxH},${width},${maxH}">`,floor=base,i=0;
 while(floor>base-maxH+9&&i<24){
  const length=(width-4)*(.88+r()*.115),a=90+(r()-.5)*(r()>.83?1.6:.6),t=a*Math.PI/180,budget=floor-(base-maxH);
  let thickness=Math.min(10.5+r()*7.5,(budget-length*Math.abs(Math.cos(t)))/Math.abs(Math.sin(t)));
  if(thickness<8.5)break;
  if(budget-thickness<10)thickness=(budget-length*Math.abs(Math.cos(t)))/Math.abs(Math.sin(t));
  const b=rotatedBounds(thickness,length,a),span=b.maxX-b.minX,jitter=1+r()*Math.max(0,width-span-2);
  s+=`<g class="stack-volume" data-stack-floor="${floor}" data-stack-height="${b.maxY-b.minY}">${renderBook({x:x+jitter-b.minX,y:floor-b.maxY,width:thickness,height:length,angle:a,id:Math.floor(r()*BOOKS.length),seed:hash(seed,i,'flat'),detail:quality})}</g>`;
  floor-=b.maxY-b.minY+1+r();i++;
 }return s+'</g>';
}
function shelfBooks(x,base,width,height,seed,mode=0,quality='full'){
 if(width<14)return'';
 if(mode===2&&width>135){const stackWidth=Math.min(width*.48,190);return flatStack(x,base,stackWidth,height*.88,seed,quality)+uprightRun(x+stackWidth+1.2,base,width-stackWidth-1.2,height,hash(seed,'standing'),true,quality);}
 if(mode===3&&width>78&&width<205)return flatStack(x,base,width,height*.91,seed,quality);
 return uprightRun(x,base,width,height,seed,mode!==0,quality);
}

function stairLandings(layout){
 const landings=[];
 layout.rooms.forEach((q,room)=>{
  if(q.shape==='portal'||q.shape==='round'||q.width<95)return;
  const bending=q.shape==='curved'||q.shape==='folded',floor=bending?q.base-Math.max(14,Math.min(23,q.height*.078,q.width*.06)):q.base;
  const angle=q.angle||0,a=angle*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const add=(localX,localY,kind,side)=>{
   const x=q.x+(localX-q.x)*c-(localY-q.base)*s,y=q.base+(localX-q.x)*s+(localY-q.base)*c;
   if(x>12&&x<W-12&&y>55&&y<H-23)landings.push({x,y,angle,room,col:q.col,row:q.row,kind,side});
  };
  add(q.x+8,floor,bending?'bending-floorboard':'shelf-floor','left');
  add(q.x+q.width-8,floor,bending?'bending-floorboard':'shelf-floor','right');
  if(q.shape==='stepped'&&q.width>230&&q.height>215){
   add(q.x+q.width*.51+8,q.base-q.height*.50,'stepped-upper','left');
   add(q.x+q.width-8,q.base-q.height*.50,'stepped-upper','right');
  }
 });
 return landings;
}

function stairCandidates(layout,seed){
 const landings=stairLandings(layout),pairs=[];
 for(const from of landings)for(const to of landings){
  const dx=Math.abs(to.x-from.x),rise=from.y-to.y;
  if(from.col!==to.col||from.side===to.side||rise<65||dx<85||rise>Math.min(485,dx*2.7)||Math.abs(from.row-to.row)>2)continue;
  const adjacent=Math.abs(from.row-to.row)===1,comfortable=rise<dx*1.6;
  const variation=hash(seed,from.room,to.room,from.kind,to.kind,from.side)/4294967296;
  pairs.push({from,to,score:(adjacent?100:20)+(comfortable?45:0)+18/(1+Math.abs(rise/dx-.70))+variation*15});
 }
 return pairs.sort((a,b)=>b.score-a.score);
}

function landingBoard(p,quality='full'){

}

function connectedStairway(pair,seed,quality='full'){
 const{from,to}=pair,span=Math.abs(to.x-from.x),dy=to.y-from.y,dir=to.x>from.x?1:-1;
 const count=Math.max(6,Math.min(28,Math.ceil(Math.max(span/23,-dy/20)))),run=span/count,rise=dy/count,railHeight=31,brace=15;
 let steps='M0 0';
 for(let i=1;i<=count;i++){const x=i===count?span:i*run,y=i===count?dy:i*rise;steps+=`V${y}H${x}`;}
 let out=`<g class="stairway connected-stairway" data-start="${from.x},${from.y}" data-end="${to.x},${to.y}" data-from-room="${from.room}" data-to-room="${to.room}" data-start-kind="${from.kind}" data-end-kind="${to.kind}" data-actual-anchors="${from.x},${from.y};${to.x},${to.y}" data-tread-count="${count}" data-tread-run="${run}" data-tread-rise="${rise}" stroke="${INK}" stroke-linejoin="round"><title>A staircase between two shelf landings.</title><g transform="translate(${from.x} ${from.y})${dir<0?' scale(-1 1)':''}"><path class="stair-carriage" d="${steps}L${span} ${dy+brace}L0 ${brace}Z" fill="url(#wood)" stroke-width="1.7"/><path d="${steps}L${span} ${dy+brace}L0 ${brace}Z" fill="url(#grain)" stroke="none"/>`;

  const x=i*run,nextX=i===count-1?span:(i+1)*run,topY=i===count-1?dy:(i+1)*rise,oldY=i*rise;
  out+=`<path class="stair-riser" d="M${x} ${oldY}V${topY}H${nextX}" fill="none" stroke="#84644a" stroke-width="2.1"/><path class="stair-tread" d="M${x} ${topY}H${nextX}V${topY-4}H${x}Z" fill="url(#stone)" stroke-width="1.15"/><path d="M${x+.8} ${topY-.6}H${nextX-.8}" stroke="#ebcfaa" stroke-width=".9"/>`;
  if(quality==='full')out+=`<path d="M${x} ${topY}H${nextX}V${topY-4}H${x}Z" fill="url(#stone-grit)" stroke="none"/><path d="M${x+run*.22} ${topY+5}h${run*.45}" stroke="#745640" stroke-opacity=".6" stroke-width=".65"/>`;

function connectedStairs(layout,seed,secondSeed,quality){

  const secondCandidates=stairCandidates(layout,secondSeed),other=secondCandidates.find(p=>p.from.col!==main.from.col)||secondCandidates.find(p=>!([p.from.room,p.to.room].some(i=>i===main.from.room||i===main.to.room)));
  if(other)out+=connectedStairway(other,secondSeed,quality);

function flyingBook(tx,ty,universe,quality,tilt){
 const pair=Math.floor(tx/2),side=((tx%2)+2)%2;
 if(side!==hash(universe,ty,pair,'flying-book-side')%2)return'';
 const seed=hash(universe,tx,ty,'book-flight'),r=random(seed),margin=100;
 const corners=[{x:105+r()*45,y:110+r()*55,quadrant:0},{x:W-105-r()*45,y:115+r()*70,quadrant:1},{x:W-110-r()*50,y:H-105-r()*55,quadrant:2},{x:110+r()*50,y:H-110-r()*45,quadrant:3}];
 const interiors=[{x:W*(.27+r()*.26),y:H*(.22+r()*.22)},{x:W*(.47+r()*.27),y:H*(.55+r()*.25)}];
 const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
 const order=shuffle(corners.slice()),slots=shuffle([0,1,2,3]);let points=[];
 order.forEach((p,i)=>{points.push(p);if(i===slots[0])points.push(interiors[0]);if(i===slots[1])points.push(interiors[1]);});
 if(r()>.5)points.reverse();
 const first=Math.floor(r()*points.length);points=points.slice(first).concat(points.slice(0,first));
 const start=points[0],factor=(.68+r()*.30)/6;
 // Symmetrically shorten each Catmull–Rom tangent near the case edges. Both
 // control handles stay in the bay and joined segments retain the same tangent.
 const tangents=points.map((p,i)=>{
  const before=points[(i+points.length-1)%points.length],after=points[(i+1)%points.length],vx=(after.x-before.x)*factor,vy=(after.y-before.y)*factor;
  const limit=Math.min(1,Math.abs(vx)>1e-8?Math.min(p.x-margin,W-margin-p.x)/Math.abs(vx):1,Math.abs(vy)>1e-8?Math.min(p.y-margin,H-margin-p.y)/Math.abs(vy):1);
  return{x:vx*Math.max(0,limit),y:vy*Math.max(0,limit)};
 });
 const fmt=p=>`${(p.x-start.x).toFixed(3)} ${(p.y-start.y).toFixed(3)}`;
 let path='M0 0';for(let i=0;i<points.length;i++){
  const next=(i+1)%points.length,p=points[i],q=points[next],a=tangents[i],b=tangents[next];
  path+=`C${fmt({x:p.x+a.x,y:p.y+a.y})} ${fmt({x:q.x-b.x,y:q.y-b.y})} ${fmt(q)}`;
 }path+='Z';
 const duration=35+(seed%25001)/1000;
 let waypoints=points.filter(p=>p.quadrant!==undefined&&p!==start);
 if(waypoints.length>3){
  let omit=0,best=-1;for(let i=0;i<waypoints.length;i++){
   const subset=[start,...waypoints.filter((_,j)=>j!==i)],xs=subset.map(p=>p.x),ys=subset.map(p=>p.y),area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys));

 return`<g class="floating-book" data-flight-tile="${tx},${ty}" data-flight-origin="${start.x},${start.y}" data-flight-pair="${pair},${ty}" transform="translate(${start.x} ${start.y})"><g class="flying-book-motion" data-flight-path="${path}" data-flight-duration="${duration}" data-flight-route="${points.map(p=>`${(p.x-start.x).toFixed(3)},${(p.y-start.y).toFixed(3)}`).join(';')}" data-flight-order="${points.map(p=>p.quadrant??'interior').join(',')}" data-flight-waypoints="${waypoints.map(p=>`${(p.x-start.x).toFixed(3)},${(p.y-start.y).toFixed(3)}`).join(';')}" style="--flight-path:path('${path}');--flight-duration:${duration}s;--flight-tilt:${tilt}deg;${fallback}">${motif('openbook',0,0,.7,seed,quality)}<path d="M-16 -29q-21 -17-27 -8q5 15 25 17M19 -29q18 -19 25 -9q-3 16-26 18" fill="#e9dfbd" stroke="${INK}" stroke-width="1"/></g></g>`;
}

function portalRoom(q,p,tx,ty,seed,includePortal,quality='full'){

 if(includePortal){const miniatureMarkup=miniature(p.seed);s+=`<svg class="portal" data-portal="${tx},${ty}" data-child="${p.seed}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" viewBox="0 0 1080 1120" overflow="hidden"><title>A library inside a library. Zoom into this doorway.</title><g class="portal-content" data-seed="${p.seed}" data-initial-bytes="${miniatureMarkup.length}">${miniatureMarkup}</g></svg>`;}
 s+=`<path d="M${p.x-7} ${p.y+p.h+4}h${p.w+14}l-9 9H${p.x-16}Z" fill="url(#wood)" stroke="${INK}" stroke-width="1.7"/>`;
 const labelW=Math.min(w-18,150);s+=`<rect x="${cx-labelW/2}" y="${Math.max(t+8,p.y-49)}" width="${labelW}" height="18" rx="2" fill="#ebd39e" stroke="${INK}"/><text x="${cx}" y="${Math.max(t+8,p.y-49)+12}" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="${INK}" letter-spacing=".55">THE SMALLER LIBRARY</text>`;

function roomContents(q,index,layout,detail=true,quality='full'){
 const r=random(q.seed),localX=q.x,w=q.width,base=q.base,height=q.height;

 if(ornamentSeed%100<16)kind=impossibleCurios[Math.floor(ornamentSeed/100)%impossibleCurios.length];
 if(layout.seed===hash(0,0,17))kind=curios[index%curios.length];
 if(layout.seed===hash(0,0,17)&&[2,9,12].includes(index))kind=impossibleCurios[[2,9,12].indexOf(index)];
 if(q.shape==='penrose'||q.shape==='hat')return renderMathShelf(q,q.seed,detail,quality);
 if(q.shape==='curved'||q.shape==='folded'){
  const nook=bendingNook(q,q.seed);

 }
 if(q.shape==='round'){
  const radius=Math.min(w*.48,height*.47),cx=localX+w/2,cy=q.top+height/2,ledge=cy+radius*.53,span=radius*1.55,clip=`circle-${layout.seed}-${index}`;
  s+=`<defs><clipPath id="${clip}"><circle cx="${cx}" cy="${cy}" r="${radius-8}"/></clipPath></defs><circle cx="${cx}" cy="${cy}" r="${radius}" fill="url(#wood)" stroke="${INK}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${radius-8}" fill="url(#shelf-shadow)" stroke="#816140" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${radius-2}" fill="none" stroke="#e2bc7b" stroke-width="1"/><g clip-path="url(#${clip})">`;
  s+=detail?flatStack(cx-span/2,ledge,span*.58,radius,q.seed,quality):'';
  s+=discovery(kind,cx+span*.22,ledge,Math.min(.95,radius/65),q.seed,quality)+beam(cx-span/2,ledge,span,12,false,quality)+'</g>';
  return s;
 }
 const slope=q.angle?`translate(${localX} ${base}) rotate(${q.angle}) translate(${-localX} ${-base})`:'';
 s+=`<g${slope?` transform="${slope}"`:''}>`;
 const isGarden=(index+layout.seed)%7===2&&w>250&&height>185;
 const isImpossible=(index+layout.seed)%11===3&&w>225&&height>190;

 const objectX=localX+w-objectWidth*.52-9;
 let usable=w-objectWidth-16;
 if(isGarden){const scale=Math.min(1.3,(height-13)/165,w/280);const id=BOOKS.findIndex(b=>b.title==='The Secret Cardigan');s+=`<g class="book" data-book="${id}"><title>The Secret Cardigan</title>${motif('gardenbook',localX+w*.5,base,scale,q.seed,quality)}</g>`;s+=shelfBooks(localX,base,w*.25,height-18,hash(q.seed,'left'),1,quality)+shelfBooks(localX+w*.77,base,w*.21,height-25,hash(q.seed,'right'),0,quality);}
 else if(isImpossible){s+=motif('impossible',localX+w*.5,base,Math.min(w/215,(height-14)/165),q.seed,quality);s+=discovery('owl',localX+w-28,base,.48,q.seed,quality)+discovery('cheese',localX+25,base,.43,q.seed,quality);}
 else if(q.shape==='stepped'&&w>230&&height>215){
  const middle=base-height*.50,shelfX=localX+w*.51;
  s+=shelfBooks(localX,base,w*.44,height-25,hash(q.seed,'tall'),1,quality)+shelfBooks(shelfX,middle,w*.46,height*.43,hash(q.seed,'upper'),2,quality)+beam(shelfX,middle,w*.49,13,false,quality);
  s+=shelfBooks(shelfX,base,w*.18,height*.43,hash(q.seed,'lower'),0,quality)+discovery(kind,localX+w*.80,base,Math.min(.9,height/270),q.seed,quality);
 }else{
  const clearance=q.shape==='arch'?Math.min(height*.28,w*.24):0;
  const plantScale=Math.min(.88,(height-clearance-20)/140,w/425);
  const planted=detail&&w>230&&height>160&&index%3===1;
  const plantWidth=planted?90*plantScale:0;
  usable-=plantWidth;
  s+=detail?shelfBooks(localX,base,usable,Math.min(335,height-clearance-14),q.seed,Math.floor(r()*4),quality):'';
  if(planted)s+=plantedCompanion(localX+usable+plantWidth*.50,base,plantScale,hash(q.seed,'pot'),quality);
  s+=discovery(kind,objectX,base,objectScale,q.seed,quality);
  if(kind==='owl'&&w>250)s+=discovery('cheese',objectX-44,base,.43,q.seed+1,quality);
  if(kind==='mouse')s+=discovery('cheese',objectX-45,base,.47,q.seed+1,quality);
  if(height>260&&r()>.65)s+=discovery('mouse',objectX-35,base,.46,q.seed+1,quality);
 }

}

function tileMarkup(tx,ty,universe=1,detail=true,includePortal=true,quality='full',pixelScale=Infinity){

}

function drawTile(tx,ty,universe,detail,includePortal,quality){
 const layout=shelfLayout(tx,ty,universe),r=random(layout.seed),p=getPortal(tx,ty,universe),seed=layout.seed,rich=quality==='full'||quality==='compact';
 let s=`<g class="shelf-tile" data-tx="${tx}" data-ty="${ty}" data-quality="${quality}" data-layout="${layout.columns.length}:${layout.rooms.map(q=>q.shape).join(',')}" transform="translate(${tx*W} ${ty*H})" clip-path="url(#tile-clip)"><rect width="1080" height="1120" fill="#61503e"/><rect width="1080" height="1120" fill="url(#shelf-shadow)"/>${rich?'<rect width="1080" height="1120" fill="url(#wall-hatch)"/>':''}`;
 for(let i=0;i<layout.rooms.length;i++){
  const q=layout.rooms[i],clip=`room-${seed}-${i}`,d=roomPath(q);
  s+=`<g class="shelf-room" data-shape="${q.shape}" data-room-bounds="${q.x-16},${q.top-18},${q.width+32},${q.height+64}" data-width="${q.width.toFixed(2)}" data-height="${q.height.toFixed(2)}">${q.shape==='curved'||q.shape==='folded'?`<defs><clipPath id="${clip}"><path d="${d}"/></clipPath></defs>`:''}`;
  if(q.shape==='portal')s+=portalRoom(q,p,tx,ty,seed,includePortal,quality)+beam(q.x-4,q.base,q.width+8,20,false,quality);
  else{
   s+=`<path d="${d}" fill="url(#${backdrops[Math.floor(r()*backdrops.length)]})" stroke="${INK}" stroke-width="2"/>${rich?`<path d="${d}" fill="url(#paper)"/>`:''}`;
   if(q.shape==='arch')s+=`<path d="${d}" fill="none" stroke="url(#wood)" stroke-width="9"/><path d="${d}" fill="none" stroke="${INK}" stroke-width="1.2"/>`;
   const bending=q.shape==='curved'||q.shape==='folded';
   s+=(bending?`<g clip-path="url(#${clip})">`:'')+roomContents(q,i,layout,detail,quality)+(bending?'</g>':'');
  }
  s+='</g>';
 }
 for(const col of layout.columns)s+=beam(col.x-5,0,col.post,H,true,quality);
 s+=beam(W-12,0,15,H,true,quality);
 const source=layout.rooms.find(q=>q.shape==='portal');
 // Keep the decoration stream stable while deriving the new flight choices
 // from their own seed; existing ladders, notes, and plants keep their places.
 const stairSeed=hash(seed,'connected-landings',r(),r(),r(),r()),secondFlight=r()>.45,secondSeed=secondFlight?hash(seed,'second-landings',r(),r(),r(),r()):null;
 s+=connectedStairs(layout,stairSeed,secondSeed,quality);
 const ladderRooms=layout.rooms.filter(q=>q.shape!=='portal'&&q.height>170),ladderRoom=ladderRooms[seed%Math.max(1,ladderRooms.length)];
 if(ladderRoom){const scale=Math.min(1.9,(ladderRoom.height+80)/200);s+=`<g transform="translate(${ladderRoom.x+ladderRoom.width*.82} ${ladderRoom.base+12}) rotate(${r()>.5?-12:9})">${discovery('ladder',0,0,scale,seed,quality)}</g>`;}
 if(seed%3===1){const q=layout.rooms.find(q=>q.shape==='stepped')||layout.rooms[0];s+=discovery('ladder',q.x+q.width*.48,q.base,.85,seed+8,quality);}
 const paperRoom=layout.rooms[Math.floor(r()*layout.rooms.length)],flightTilt=(r()-.5)*25;
 s+=flyingBook(tx,ty,universe,quality,flightTilt);
 const gardenRooms=layout.rooms.filter((q,i)=>q.shape==='curved'||q.shape==='folded'||i%3===1);
 for(const q of gardenRooms){
  const vineSeed=hash(q.seed,'draped-vine'),drop=70+vineSeed%52;
  s+=trailingVine(q.x+4,q.base+7,q.width-8,drop,vineSeed,quality);
 }
 const portalSide=source.x+source.width-25,portalPotScale=Math.min(.62,source.height/360);
 if(source.width-p.w>95)s+=plantedCompanion(portalSide,source.base,portalPotScale,hash(seed,'door-garden'),quality);
 s+=`<g transform="translate(${paperRoom.x+10} ${paperRoom.base-70}) rotate(-11)" stroke="${INK}" stroke-width=".8"><path d="M0 0h30v42h-30Z" fill="#fff0cb"/><path d="M5 9h21M5 15h16M5 22h19M5 29h11" stroke="#9f8552"/></g>`;
 return s+`${rich?'<rect width="1080" height="1120" fill="url(#paper)" pointer-events="none"/>':''}</g>`;
}

function overviewMarkup(tx,ty,universe=1,translated=true){
 const layout=shelfLayout(tx,ty,universe),r=random(layout.seed),quality='preview';let s=`<g${translated?` transform="translate(${tx*W} ${ty*H})"`:''}><rect width="1080" height="1120" fill="#443e32"/>`;

  if(q.shape==='penrose'||q.shape==='hat'){s+=overviewMathShelf(q,q.seed);continue;}

  if(q.shape==='round'){s+=`<circle cx="${q.x+q.width/2}" cy="${q.top+q.height/2}" r="${Math.min(q.width,q.height)*.43}" fill="#b88c60" stroke="#433629" stroke-width="8"/>`;continue;}

// A doorway only a few dozen pixels wide needs architectural silhouettes,
// not hundreds of individually fitted spines. The real room boundaries and
// mathematical tiles remain intact; close-up portal content is installed later.
function previewMarkup(tx,ty,universe=1,translated=true){
 const layout=shelfLayout(tx,ty,universe),quality='preview';
 let out=`<g class="library-preview"${translated?` transform="translate(${tx*W} ${ty*H})"`:''}><rect width="${W}" height="${H}" fill="#443e32"/>`;
 for(const q of layout.rooms){
  out+=`<path d="${roomPath(q)}" fill="url(#${backdrops[hash(q.seed,'backdrop')%backdrops.length]})" stroke="#9b764e" stroke-width="7"/>`;
  if(q.shape==='penrose'||q.shape==='hat'){out+=overviewMathShelf(q,q.seed);continue;}
  if(q.shape==='curved'||q.shape==='folded'){out+=overviewBendingShelf(q,q.seed,'silhouette');continue;}
  const r=random(q.seed),count=4+q.seed%3,width=(q.width-12)/count;
  for(let i=0;i<count;i++){
   const h=(q.height-28)*(.48+r()*.43),x=q.x+5+i*width;
   out+=`<path d="M${x} ${q.base}V${q.base-h}h${width-2}V${q.base}Z" fill="${colors[Math.floor(r()*colors.length)]}"/>`;
  }
  out+=beam(q.x-3,q.base,q.width+6,17,false,quality);
 }
 for(const col of layout.columns)out+=beam(col.x-5,0,col.post,H,true,quality);
 return out+'</g>';
}

const { createScene } = (() => {
// Keep CSS-driven motion in its own transparent SVG surface. Static shelves
// can then retain their painted pixels while fish, mice and pendulums move.
const NS='http://www.w3.org/2000/svg';
const MOTION='.running-mouse,.flying-book-motion,.twinkle,.swimming-fish,.fish-tail,.clock-pendulum,.falling-leaf,.rocking-horse';
const make=()=>document.createElementNS(NS,'g');

function intersects(box,state,margin=0){
 const left=state.x-state.w/(2*state.s)-margin,top=state.y-state.h/(2*state.s)-margin;
 return box.x+box.w>left&&box.y+box.h>top&&box.x<left+state.w/state.s+2*margin&&box.y<top+state.h/state.s+2*margin;
}

function createScene(svg){
 const camera=svg.querySelector('#camera');
 const motionSvg=document.createElementNS(NS,'svg');
 motionSvg.id='motion-world';motionSvg.setAttribute('xmlns',NS);
 motionSvg.setAttribute('aria-label','The library’s little moving inhabitants');
 motionSvg.setAttribute('preserveAspectRatio','xMidYMid slice');
 const motionCamera=make();motionCamera.id='motion-camera';motionSvg.append(motionCamera);
 svg.after(motionSvg);

 function setCamera(state){
  const transform=`translate(${state.w/2} ${state.h/2}) scale(${state.s}) translate(${-state.x} ${-state.y})`;
  camera.setAttribute('transform',transform);motionCamera.setAttribute('transform',transform);
 }
 function resize(state){motionSvg.setAttribute('viewBox',`0 0 ${state.w} ${state.h}`);}

 function restore(record){
  for(const room of record.rooms||[])room.slot.replaceWith(room.el);
  for(const item of record.items||[])item.anchor.replaceWith(item.el);
  for(const entry of record.motionEntries||[]){
   for(const [el,value] of entry.clipAttributes||[])el.setAttribute('clip-path',value);
   entry.el.classList.remove('motion-still');entry.placeholder.replaceWith(entry.el);
  }
  record.motionEl?.remove();record.motionEntries=[];record.rooms=[];record.items=[];
 }

 function prepare(record){
  const roots=new Set();
  for(const node of record.el.querySelectorAll(MOTION)){
   const flight=node.closest('.floating-book');
   if(flight){roots.add(flight);continue;}
   // Keep a clock's trim in front of its pendulum on the same small surface.
   const clock=node.closest('.motif-mantelclock,.motif-cuckooclock');
   if(clock){roots.add(clock);continue;}
   let parent=node.parentElement,insideMotion=false;
   while(parent&&parent!==record.el){if(parent.matches(MOTION)){insideMotion=true;break;}parent=parent.parentElement;}
   if(!insideMotion)roots.add(node);
  }
  const inverse=camera.getCTM()?.inverse();
  // Read every geometry before moving any node to avoid alternating DOM writes
  // and layout reads. Bounds are stored in world coordinates, independent of zoom.
  const bounds=el=>{
   const b=el.getBBox(),m=inverse?.multiply(el.getCTM()),point=(x,y)=>m?{x:m.a*x+m.c*y+m.e,y:m.b*x+m.d*y+m.f}:{x,y};
   const corners=[point(b.x,b.y),point(b.x+b.width,b.y),point(b.x,b.y+b.height),point(b.x+b.width,b.y+b.height)];
   const xs=corners.map(p=>p.x),ys=corners.map(p=>p.y),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
   return{x,y,w,h};
  };
  const geometry=[...roots].map(el=>{
   const b=bounds(el),size=Math.max(b.w,b.h),flight=el.matches('.floating-book'),pad=el.matches('.falling-leaf')?120:el.matches('.running-mouse')?Math.max(70,b.w):15;
   return{el,size,box:flight?{x:record.tx*1080,y:record.ty*1120,w:1080,h:1120}:{x:b.x-pad,y:b.y-pad,w:b.w+2*pad,h:b.h+2*pad}};
  });
  const items=[...record.el.querySelectorAll('.book')].map(el=>({el,box:bounds(el),visible:true}));
  record.motionEl=make();record.motionEntries=[];record.rooms=[];record.items=[];
  const motionDefs=document.createElementNS(NS,'defs');record.motionEl.append(motionDefs);
  const clipCopies=new Map();
  function motionClip(value){
   const match=/^url\(#([^)]*)\)$/.exec(value||'');if(!match)return value;
   const id=match[1];if(clipCopies.has(id))return `url(#${clipCopies.get(id)})`;
   const original=document.getElementById(id);if(!original)return value;
   const copy=original.cloneNode(true),key=`motion-${record.seed}-${record.tx}-${record.ty}-${id}`;
   copy.id=key;motionDefs.append(copy);clipCopies.set(id,key);return `url(#${key})`;
  }
  const parents=new Map([[record.el,record.motionEl]]);
  function motionParent(parent){
   if(parents.has(parent))return parents.get(parent);
   const copy=parent.cloneNode(false);copy.removeAttribute('id');
   if(copy.hasAttribute('clip-path'))copy.setAttribute('clip-path',motionClip(copy.getAttribute('clip-path')));

  }
  for(const entry of geometry){
   const holder=make(),placeholder=make();
   motionParent(entry.el.parentElement).append(holder);
   entry.clipAttributes=[];
   for(const el of [entry.el,...entry.el.querySelectorAll('[clip-path]')])if(el.hasAttribute('clip-path')){
    const value=el.getAttribute('clip-path'),match=/^url\(#([^)]*)\)$/.exec(value),definition=match&&document.getElementById(match[1]);
    if(definition&&!entry.el.contains(definition)){entry.clipAttributes.push([el,value]);el.setAttribute('clip-path',motionClip(value));}
   }
   entry.el.replaceWith(placeholder);holder.append(entry.el);
   Object.assign(entry,{holder,placeholder,active:true});record.motionEntries.push(entry);
  }
  for(const item of items){
   item.anchor=document.createComment('book');item.el.after(item.anchor);record.items.push(item);
  }
  const tile=record.el.querySelector('.shelf-tile');
  if(tile)for(const el of [...tile.children])if(el.matches('.shelf-room[data-room-bounds]')){
   const [x,y,w,h]=el.dataset.roomBounds.split(',').map(Number),slot=make();
   slot.classList.add('room-slot');el.replaceWith(slot);slot.append(el);
   record.rooms.push({el,slot,box:{x:record.tx*1080+x,y:record.ty*1120+y,w,h},visible:true});
  }
  motionCamera.append(record.motionEl);
 }

 function sync(record,state){
  for(const room of record.rooms||[]){
   const visible=intersects(room.box,state,12/state.s);
   if(visible===room.visible)continue;
   room.visible=visible;if(visible)room.slot.append(room.el);else room.el.remove();
  }
  for(const item of record.items||[]){
   const visible=intersects(item.box,state,8/state.s)&&Math.min(item.box.w,item.box.h)*state.s>=.6;
   if(visible===item.visible)continue;
   item.visible=visible;if(visible)item.anchor.before(item.el);else item.el.remove();
  }
  for(const entry of record.motionEntries||[]){
   const active=entry.placeholder.isConnected&&entry.size*state.s>=6&&intersects(entry.box,state);
   if(active===entry.active)continue;
   entry.active=active;entry.el.classList.toggle('motion-still',!active);
   // Small inhabitants keep a still vector pose in the static shelf. Completely
   // offscreen rooms hold that pose detached, ready for a cheap return journey.
   (active?entry.holder:entry.placeholder).append(entry.el);
  }
 }
 function attach(record,state){
  camera.append(record.el);
  if(!record.motionEl)prepare(record);else motionCamera.append(record.motionEl);
  sync(record,state);
 }
 function detach(record){record.el.remove();record.motionEl?.remove();}
 function refresh(record,state){restore(record);prepare(record);sync(record,state);}
 function exportLayers(copy,selector=MOTION){
  const target=copy.querySelector('#camera');
  for(const record of motionCamera.children)target.append(record.cloneNode(true));
  return [...svg.querySelectorAll(selector),...motionSvg.querySelectorAll(selector)];
 }
 return{motionSvg,motionCamera,setCamera,resize,attach,detach,restore,refresh,sync,exportLayers};
}

return { createScene };
})();

  <body>
    <a class="skip-link" href="#stage">Skip to the bookshelf</a>
    <header class="masthead">
      <a class="wordmark" href="#stage" aria-label="The Unfinished Library, home">
        <svg class="wordmark-icon" viewBox="0 0 42 44" aria-hidden="true">
          <path d="M7 8.5 20.5 5l14 3.5v27L21 32 7 35.5zM21 5v27M7 12.5 21 9l13.5 3.5M11 17l6-1.5M11 21l6-1.5M25 16l6 1.5M25 20l6 1.5" />
          <path d="M3.5 14v25L21 35l17.5 4V14" />
          <path class="wordmark-star" d="m30.5 1.5.8 2.6 2.7.7-2.7.8-.8 2.6-.7-2.6-2.6-.8 2.6-.7z" />
        </svg>
        <span class="wordmark-copy">
          <span class="eyebrow">A world between the spines</span>
          <h1 class="library-title">The Unfinished Library</h1>
        </span>
      </a>
      <nav class="header-actions" aria-label="Library tools">
        <button id="explore-btn" class="button button-explore" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m13 7-2 4-4 2 2-4z"/></svg>
          <span>Explore</span>
        </button>
        <button id="export-btn" class="button button-quiet" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 12v4h12v-4"/></svg>
          <span>Save SVG</span>
        </button>
      </nav>
    </header>

    <main id="stage" class="stage" tabindex="0" aria-label="Interactive illustrated bookshelf. Drag to wander, scroll to zoom. Use arrow keys to move and plus or minus to zoom.">
      <svg id="world" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An endless whimsical bookshelf with 200 literary puns, curved and folding shelves, Penrose and Hat compartments, impossible curios and stairways, tiny mice, toys, and toadstools" preserveAspectRatio="xMidYMid slice">
        <title>The Unfinished Library</title>
        <desc>A bright illustrated library of curling shelves, colourful books, potted plants and trailing vines that continues in every direction and within its own smallest shelves.</desc>
      </svg>

      <div class="intro-chip" aria-hidden="true">
        <svg viewBox="0 0 20 20"><path d="m10 2 1.7 5.3L17 9l-5.3 1.7L10 16l-1.7-5.3L3 9l5.3-1.7zM16 13l.7 2.3L19 16l-2.3.7L16 19l-.7-2.3L13 16l2.3-.7z"/></svg>
        <span>Every spine has a story.</span>
      </div>

      <div class="discovery-counter" title="Discover hidden inhabitants by selecting them">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2.5 2.2 4.4 4.8.7-3.5 3.4.8 4.8-4.3-2.3-4.3 2.3.8-4.8L3 7.6l4.8-.7z"/></svg>
        <span class="counter-label">Little discoveries</span>
        <span id="found-count" class="counter-value">0</span>
      </div>

      <div id="book-toast" class="book-toast" role="status" aria-live="polite" hidden></div>

      <div class="navigation-dock" aria-label="View controls">
        <div class="dock-group wander-controls">
          <button id="pan-left" class="icon-button" type="button" aria-label="Wander left" title="Wander left (←)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg>
          </button>
          <span class="dock-caption">Wander</span>
          <button id="pan-right" class="icon-button" type="button" aria-label="Wander right" title="Wander right (→)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
          </button>
        </div>
        <span class="dock-divider" aria-hidden="true"></span>
        <div class="dock-group zoom-controls">
          <button id="zoom-out" class="icon-button" type="button" aria-label="Zoom out" title="Zoom out (−)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
          </button>
          <output id="zoom-readout" class="zoom-readout" aria-label="Zoom level">40%</output>
          <button id="zoom-in" class="icon-button" type="button" aria-label="Zoom in" title="Zoom in (+)">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg>
          </button>
        </div>
        <span class="dock-divider" aria-hidden="true"></span>
        <button id="home-btn" class="icon-button" type="button" aria-label="Return to the beginning" title="Return to the beginning (Home)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m3 9 7-6 7 6M5 8v9h10V8M8 17v-6h4v6"/></svg>
        </button>
        <button id="motion-btn" class="icon-button" type="button" aria-label="Pause little animations" aria-pressed="false" title="Pause little animations">
          <svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg>
          <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z"/></svg>
        </button>
      </div>

      <div class="scene-caption">
        <span class="caption-rule" aria-hidden="true"></span>
        <span>An infinite, impossible bookshelf</span>
      </div>
      <div class="view-details">
        <span id="location-label">The beginning, more or less</span>
        <span id="hint">Drag to wander · scroll to look closer</span>
      </div>
      <a class="inspiration-credit" href="https://en.wikipedia.org/wiki/Colin_Thompson_(writer)" target="_blank" rel="noopener noreferrer">Inspired by Colin Thompson</a>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
    </main>

  </body>
</html>
